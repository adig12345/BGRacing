# ROS2 parameters for all nodes. Top-level key = node name (must match exactly).
track_publisher:
  ros__parameters:
    csv_path: /app/data/BrandsHatchLayout.csv  # path inside the container
    frame_id: map          # coordinate frame name in the message headers

track_processor:
  ros__parameters:
    optimizer: min_distance  # one of: centerline | min_distance
    alpha_limit: 0.8         # max |offset| as a fraction of the half-width (safety margin)
    max_iterations: 200      # max sweeps of the min_distance solver
    tolerance: 0.000001      # stop when no offset changes by more than this
    output_dir: /output      # folder (inside the container) for PNG plots
